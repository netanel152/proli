name: tests

# PRO-83: the offline E2E harness has to run on every PR to be worth anything.
# Until this workflow existed the repo had no automated pytest run at all — only
# the Railway start/stop workflows.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Settings() requires these at import. They are deliberately fake: the suite
      # never reaches a real service (mongomock for Mongo, fakeredis for Redis,
      # recorded fixtures for Gemini, and tests/e2e's transport guard makes any
      # real HTTP call fail the run).
      # PRO-86: GREEN_API_* are gone — Settings no longer declares them.
      GEMINI_API_KEY: "ci-not-a-real-key"
      CLOUDINARY_CLOUD_NAME: "ci"
      CLOUDINARY_API_KEY: "ci"
      CLOUDINARY_API_SECRET: "ci"
      # Set for anything that reads settings at import time. Note it is NOT what
      # keeps the unit suite from sending: tests/conftest.py deliberately forces
      # WHATSAPP_DRY_RUN back to False so the client tests exercise the real gate.
      # Those tests never reach a socket because they stub `_send_request`.
      WHATSAPP_DRY_RUN: "true"

    steps:
      - uses: actions/checkout@v4

      # PRO-86: Green API is gone (PRO-85 — instance deleted, tariff cancelled).
      # The provider facade is only a single egress if nothing can reach a vendor
      # endpoint directly, so any reintroduction of a Green API URL — in app code,
      # a script, a test fixture or a doc — fails the build rather than quietly
      # recreating the bypass class that caused the yellowCard incident.
      # Matches both spellings: `green-api.com` (the real host) and `greenapi.com`.
      - name: Guard — no Green API references
        run: |
          if grep -rInE 'greenapi\.com|green-api\.com' \
               --exclude-dir=.git \
               --exclude-dir=.github \
               --exclude-dir=venv \
               --exclude-dir=__pycache__ \
               --exclude-dir=logs \
               . ; then
            echo ""
            echo "::error::Green API reference found. Proli left Green API in PRO-85;"
            echo "::error::all WhatsApp traffic goes through app/providers/whatsapp/."
            exit 1
          fi
          echo "OK — no Green API references."

      # ARCHITECTURE_STANDARD.md §6.2 — the single-egress rule, mechanised.
      # Two ways to bypass the facade's circuit breaker / kill switch / dry-run:
      # an HTTP client called directly from a service, or a provider constructed
      # outside app/providers/whatsapp/. Both fail the build. geocoding_service
      # is the one allowlisted HTTP consumer (Nominatim, not a messaging vendor);
      # tests may construct providers freely — they test them.
      - name: Guard — all outbound traffic through the provider facade
        run: |
          if grep -rInE '^\s*(import|from)\s+(httpx|requests)\b' app/services/ \
               | grep -v 'app/services/geocoding_service.py' ; then
            echo ""
            echo "::error::HTTP client import in a service. Outbound WhatsApp goes"
            echo "::error::through app/providers/whatsapp/ (PRO-86); other HTTP"
            echo "::error::belongs in app/core/http_client.py or a provider. If this"
            echo "::error::service is a legitimate non-vendor HTTP consumer, add it"
            echo "::error::to the allowlist in this step with a reason."
            exit 1
          fi
          if grep -rInE '(CloudAPIProvider|DryRunProvider)\s*\(' app/ \
               --exclude-dir=__pycache__ \
               | grep -v 'app/providers/whatsapp/' ; then
            echo ""
            echo "::error::Provider constructed outside app/providers/whatsapp/."
            echo "::error::Use app.providers.whatsapp.get_whatsapp() — a bare provider"
            echo "::error::skips the circuit breaker and the operator kill switch."
            exit 1
          fi
          echo "OK — single egress holds."

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile's base image, so CI resolves the same wheels
          # production does (the pins in requirements.txt are version-sensitive).
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No lint step yet: `black --check .` currently reformats 55 pre-existing
      # files and the repo has no flake8 config, so enforcing either here would
      # fail on day one for reasons unrelated to the change under review. Adding
      # them is a separate cleanup; `black .` / `flake8 .` stay local commands
      # (see CLAUDE.md).
      - name: Run tests
        run: |
          set -o pipefail
          pytest -q | tee pytest-output.txt

      # docs/TESTING.md's "Current status" line is the single source of truth
      # for the test baseline, but until this step it was only enforced by
      # agents remembering to read it. Now it is a build invariant, both ways:
      # fewer passed than the baseline = a regression slipped in; more passed
      # = tests were added without bumping the doc (a stale baseline makes the
      # next regression invisible). Update the line in the same PR that moves
      # the count.
      - name: Guard — test baseline matches docs/TESTING.md
        run: |
          baseline=$(grep -oP 'Current status: \K[0-9]+(?= passed)' docs/TESTING.md)
          actual=$(grep -oP '\b\K[0-9]+(?= passed)' pytest-output.txt | tail -1)
          if [ -z "$baseline" ] || [ -z "$actual" ]; then
            echo "::error::Could not parse the baseline ('Current status: N passed' in docs/TESTING.md) or the pytest summary."
            exit 1
          fi
          echo "baseline=$baseline actual=$actual"
          if [ "$actual" -lt "$baseline" ]; then
            echo "::error::Regression: $actual tests passed but docs/TESTING.md says $baseline."
            exit 1
          elif [ "$actual" -gt "$baseline" ]; then
            echo "::error::Stale baseline: $actual tests passed but docs/TESTING.md still says $baseline."
            echo "::error::Update the 'Current status' line in docs/TESTING.md in this PR."
            exit 1
          fi
          echo "OK — baseline holds at $baseline passed."
