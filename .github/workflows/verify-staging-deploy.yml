# Fails a push to dev that staging does not build and serve within 12 minutes,
# because a stale environment looks exactly like a quiet one. See docs/CI_WORKFLOWS.md.

name: 🔎 Verify staging deployed this commit

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || 'https://api-staging-e66f.up.railway.app/health' }}
    steps:
      - name: Wait for staging to serve this commit
        env:
          STAGING_HEALTH_TOKEN: ${{ secrets.STAGING_HEALTH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${STAGING_HEALTH_TOKEN:-}" ]; then
            echo "::error::STAGING_HEALTH_TOKEN secret is not set — the detector cannot read /health's commit field."
            exit 1
          fi
          WANT="${GITHUB_SHA}"
          DEADLINE=$(( SECONDS + 720 ))
          echo "Waiting for staging to build+serve ${WANT} (up to 12 min)..."
          LAST=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            BODY=$(curl -fsS --max-time 15 -H "X-Health-Token: $STAGING_HEALTH_TOKEN" "$HEALTH_URL" 2>/dev/null || echo '')
            if [ -n "$BODY" ]; then
              GOT=$(echo "$BODY" | jq -r '.commit // "none"')
              STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
              if [ "$GOT" = "$WANT" ] && [ "$STATUS" = "healthy" ]; then
                echo "::notice::Staging is serving ${WANT} and healthy — deploy trigger alive."
                exit 0
              fi
              # Only log on change to keep the output readable.
              if [ "$GOT $STATUS" != "$LAST" ]; then
                echo "  staging serves commit=$GOT status=$STATUS — still waiting"
                LAST="$GOT $STATUS"
              fi
            else
              echo "  health endpoint not responding — still waiting"
            fi
            sleep 20
          done
          echo "::error::Staging never served ${WANT}. The Railway deploy trigger is likely dead again (PRO-155) — reconnect the service source (connect_service_source -> netanel152/proli@dev for api/worker/admin) and see docs/RAILWAY_SETUP.md."
          exit 1
