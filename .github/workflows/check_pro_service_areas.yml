name: 🗺️ Check pro service areas

# PRO-27's backfill, as a button.
#
# Matching reaches a pro only through `$geoNear` on the pro's GeoJSON
# `location`. A pro whose `service_areas` never resolved to coordinates has no
# `location`, is never offered a lead, and nothing says so — the 2026-04-18
# failure class. Approval now runs the check per pro; this runs
# `scripts/check_pro_service_areas.py` across the pros approved *before* that,
# against the real database. The report it writes into the job summary is the
# evidence the issue's `launch-readiness` gate asks for: a merged script is not
# proof the script was ever run.
#
# Same shape as 🛑 Stop Railway Proli Services — the branch you run it from is
# the target. `dev` checks staging, `production` checks production, any other
# branch refuses, so a feature branch can never write to a real database. The
# run-list line names the target before anything happens.
#
# The one control is a checkbox, and it is a checkbox rather than a text box on
# purpose: the 2026-09-08 confirm box refused four operator runs in a row over
# a phone keyboard's trailing space. Unticked is read-only.

run-name: >-
  ${{ github.ref_name == 'production' && '🗺️ Check pro service areas — PRODUCTION' || (github.ref_name == 'dev' && '🗺️ Check pro service areas — staging' || '🗺️ Refused — run from dev (staging) or production') }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the fixes: set `location` on pros that have none, record each pro's verdict. Leave unticked for a read-only report."
        type: boolean
        default: false

jobs:
  check-service-areas:
    runs-on: ubuntu-latest
    steps:
      # The branch name reaches the script through `env:`, never `${{ }}`
      # inside `run:`, and only the two known names resolve to a target.
      - name: Resolve the target from the branch
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${REF_NAME:-}" in
            dev)        TARGET=staging ;;
            production) TARGET=production ;;
            *)
              echo "::error::Run this workflow from 'dev' to check staging or from 'production' to check production. Branch '${REF_NAME:-}' maps to nothing. Refusing to touch any database."
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Branch '$REF_NAME' → checking $TARGET."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The script runs on this runner with Railway's environment injected, so
      # the runner needs the app's own dependencies.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # No Railway CLI and no Railway token. `railway run` was only ever a
      # way to hand the script three connection settings, and on 2026-09-10
      # it stopped being a reliable one: a project token created that morning
      # was refused as "Invalid RAILWAY_TOKEN" under both credential names,
      # through four rotations, while a four-month-old token in the same
      # project kept working. Everything inside this repo was ruled out with
      # evidence — the value, the secret's scope in GitHub, the `--environment`
      # flag, the CLI version, the service name — so the fault sits on
      # Railway's side, and this workflow no longer depends on it.
      #
      # The settings come straight from repo secrets instead. Fewer moving
      # parts, and the database is chosen by the same branch that chooses
      # everything else.
      - name: Verify the connection settings resolved
        id: creds
        env:
          MONGO_URI: ${{ steps.target.outputs.target == 'production' && secrets.PRODUCTION_MONGO_URI || secrets.STAGING_MONGO_URI }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set +e
          set -uo pipefail

          # The guard that matters most. `Settings.MONGO_URI` defaults to
          # localhost when unset, so a missing secret would not fail — it
          # would connect to an empty database on the runner and report
          # "0 pros, everything fine". That is the exact false green this
          # check exists to prevent, and it would be indistinguishable from
          # a real clean result.
          if [ -z "${MONGO_URI:-}" ]; then
            echo "::error::No MONGO_URI resolved for '$TARGET'. Add it as a *repository* secret (Settings → Secrets and variables → Actions) named PRODUCTION_MONGO_URI or STAGING_MONGO_URI — a secret under Settings → Environments is invisible here, since this job declares no environment. Refusing to run: without it the script would silently check an empty local database and call it clean."
            exit 1
          fi

          # The database name, and nothing else from the URI — never the
          # host and never the credentials. It answers the one question that
          # went unanswered when production came back empty: which database
          # did this actually read?
          DB_NAME="$(python -c 'import os, urllib.parse as up; p = up.urlsplit(os.environ["MONGO_URI"]).path or ""; print(p.lstrip("/").split("?")[0] or "(none named in the URI)")')"
          echo "Connection settings resolved for $TARGET"
          echo "  database:    $DB_NAME"

      - name: Check service areas in ${{ steps.target.outputs.target }}
        id: check
        env:
          MONGO_URI: ${{ steps.target.outputs.target == 'production' && secrets.PRODUCTION_MONGO_URI || secrets.STAGING_MONGO_URI }}
          REDIS_URL: ${{ steps.target.outputs.target == 'production' && secrets.PRODUCTION_REDIS_URL || secrets.STAGING_REDIS_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # `Settings` refuses to construct without these four. This script
          # touches neither Gemini nor Cloudinary, so they are placeholders,
          # not credentials — the same thing the test suite does.
          GEMINI_API_KEY: unused-by-this-script
          CLOUDINARY_CLOUD_NAME: unused-by-this-script
          CLOUDINARY_API_KEY: unused-by-this-script
          CLOUDINARY_API_SECRET: unused-by-this-script
          # Deliberately `development`, and the trade-off is worth naming:
          # `staging`/`production` would make Settings demand WEBHOOK_TOKEN
          # and fail closed on HEALTH_TOKEN, neither of which this script
          # uses. Nothing it does is gated on ENVIRONMENT. The consequence is
          # that ENVIRONMENT no longer describes the data being read — the
          # branch and the secret it selects do, and the step above prints
          # the database name so that choice is visible rather than assumed.
          ENVIRONMENT: development
          TARGET_ENV: ${{ steps.target.outputs.target }}
          APPLY: ${{ inputs.apply }}
        run: |
          set +e
          set -uo pipefail

          if [ "${APPLY:-false}" = "true" ]; then
            FLAGS="--apply"
            MODE="--apply (writing verdicts and missing locations)"
          else
            FLAGS=""
            MODE="read-only (dry run — no writes)"
          fi

          echo "Checking pro service areas in $TARGET_ENV — $MODE"

          CMD=(python scripts/check_pro_service_areas.py)
          if [ -n "$FLAGS" ]; then
            CMD+=("$FLAGS")
          fi

          "${CMD[@]}" 2>&1 | tee report.txt
          code=${PIPESTATUS[0]}

          {
            echo "## 🗺️ Pro service areas — $TARGET_ENV"
            echo
            echo "- Mode: $MODE"
            echo "- Exit code: \`$code\`"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The script's exit codes, kept as the job's verdict so a checklist
          # can be ticked on a green run and only on a green run.
          case "$code" in
            0)
              echo "✅ Every checked pro can be placed on the map."
              ;;
            1)
              echo "::error::Some pros have service areas the geocoder does not know, or resolve but carry no location. See the job summary — fix the areas in the admin panel, or re-run with the apply box ticked."
              ;;
            2)
              echo "::warning::The geocoder was unavailable for at least one area, so the verdict is incomplete. Re-run in a minute (the geo:unavailable flag clears after 60s)."
              ;;
            3)
              echo "::error::No pro matched the filter, so this run checked nothing and is not evidence of anything. The report says which population is empty — see the job summary."
              ;;
            *)
              echo "::error::The check did not complete (exit $code). See the log above."
              ;;
          esac
          exit "$code"
