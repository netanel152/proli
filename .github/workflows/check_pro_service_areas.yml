name: 🗺️ Check pro service areas

# PRO-27's backfill, as a button.
#
# Matching reaches a pro only through `$geoNear` on the pro's GeoJSON
# `location`. A pro whose `service_areas` never resolved to coordinates has no
# `location`, is never offered a lead, and nothing says so — the 2026-04-18
# failure class. Approval now runs the check per pro; this runs
# `scripts/check_pro_service_areas.py` across the pros approved *before* that,
# against the real database. The report it writes into the job summary is the
# evidence the issue's `launch-readiness` gate asks for: a merged script is not
# proof the script was ever run.
#
# Same shape as 🛑 Stop Railway Proli Services — the branch you run it from is
# the target. `dev` checks staging, `production` checks production, any other
# branch refuses, so a feature branch can never write to a real database. The
# run-list line names the target before anything happens.
#
# The one control is a checkbox, and it is a checkbox rather than a text box on
# purpose: the 2026-09-08 confirm box refused four operator runs in a row over
# a phone keyboard's trailing space. Unticked is read-only.

run-name: >-
  ${{ github.ref_name == 'production' && '🗺️ Check pro service areas — PRODUCTION' || (github.ref_name == 'dev' && '🗺️ Check pro service areas — staging' || '🗺️ Refused — run from dev (staging) or production') }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the fixes: set `location` on pros that have none, record each pro's verdict. Leave unticked for a read-only report."
        type: boolean
        default: false

jobs:
  check-service-areas:
    runs-on: ubuntu-latest
    steps:
      # The branch name reaches the script through `env:`, never `${{ }}`
      # inside `run:`, and only the two known names resolve to a target.
      - name: Resolve the target from the branch
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${REF_NAME:-}" in
            dev)        TARGET=staging ;;
            production) TARGET=production ;;
            *)
              echo "::error::Run this workflow from 'dev' to check staging or from 'production' to check production. Branch '${REF_NAME:-}' maps to nothing. Refusing to touch any database."
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Branch '$REF_NAME' → checking $TARGET."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The script runs on this runner with Railway's environment injected, so
      # the runner needs the app's own dependencies.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # A missing credential otherwise surfaces as one opaque line — "Invalid
      # RAILWAY_TOKEN" — that says nothing about which of the several causes
      # it is. On 2026-09-10 that cost two rounds of guessing against a token
      # that turned out to be correctly scoped in Railway.
      #
      # This answers exactly one question, the one the CLI's message cannot:
      # did a value reach the job at all? It prints the credential's LENGTH,
      # never a character of it. Zero means the secret did not resolve — most
      # often because it is stored under Settings → Environments rather than
      # as a repository secret, which yields an empty string in a job that
      # declares no `environment:`. Any other length means a value arrived,
      # and whatever the real command says next is about that value.
      #
      # It deliberately does NOT probe with `railway whoami`: that is an
      # account-scoped command, and a project token — which is what these
      # secrets hold, and what Railway's own tokens page tells you to pass as
      # RAILWAY_TOKEN — has no user identity behind it. A probe that a valid
      # project token cannot pass would fail the job before the real command
      # ever ran, which is worse than the opaque line it set out to replace.
      - name: Fingerprint the Railway credential
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.target == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -uo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::The repo secret for '$TARGET' resolved to an empty string, so no credential reached the Railway CLI. Check Settings → Secrets and variables → Actions: the secret must exist as a *repository* secret named RAILWAY_TOKEN_STAGING or RAILWAY_TOKEN_PRODUCTION. A secret stored under Settings → Environments is invisible to this job, which declares no environment."
            exit 1
          fi

          # Everything below is a fingerprint, not the value. The last four
          # characters are what Railway's own tokens page prints next to each
          # token ("****-3bc1"), so showing them here discloses nothing the
          # dashboard does not already show — and they are what lets an
          # operator tell "the secret holds the token I am looking at" from
          # "it holds something else", which is otherwise unknowable: GitHub
          # never shows a secret's value again once saved.
          TRIMMED="$(printf '%s' "$RAILWAY_TOKEN" | tr -d '[:space:]')"
          echo "Credential fingerprint for $TARGET"
          echo "  length:      ${#RAILWAY_TOKEN} characters"
          # From the trimmed value: a trailing newline would otherwise push a
          # line break into the middle of the comparison it exists to serve.
          echo "  last 4:      ...${TRIMMED: -4}   (compare with the Token column in Railway → Project Settings → Tokens)"
          if [ "${#TRIMMED}" -ne "${#RAILWAY_TOKEN}" ]; then
            echo "  whitespace:  YES — the stored value carries $(( ${#RAILWAY_TOKEN} - ${#TRIMMED} )) whitespace character(s), which Railway will reject. Re-save the secret without them."
          else
            echo "  whitespace:  none"
          fi
          if printf '%s' "$TRIMMED" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "  shape:       a well-formed UUID, which is what a Railway project token looks like"
          else
            echo "  shape:       NOT a UUID — a Railway project token is one, so this is very likely the wrong value entirely"
          fi

      # Keyed on the resolve step's output, not on the branch name again, so
      # the token and the environment name can never disagree with what was
      # just resolved. `railway run` injects that environment's variables
      # (MONGO_URI, REDIS_URL, GOOGLE_MAPS_API_KEY) — none of them are ever
      # printed, and `ENVIRONMENT` is cross-checked against Railway's own
      # RAILWAY_ENVIRONMENT_NAME at import (PRO-96), so a mis-scoped token
      # fails to boot rather than reporting on the wrong database.
      - name: Check service areas in ${{ steps.target.outputs.target }}
        id: check
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.target == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_ENV: ${{ steps.target.outputs.target == 'production' && 'Production' || 'Staging' }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -uo pipefail

          if [ "${APPLY:-false}" = "true" ]; then
            FLAGS="--apply"
            MODE="--apply (writing verdicts and missing locations)"
          else
            FLAGS=""
            MODE="read-only (dry run — no writes)"
          fi

          echo "Checking pro service areas in $RAILWAY_ENV — $MODE"

          # No --environment flag, deliberately: a Railway project token is
          # bound to one environment already, so the credential pins it —
          # something an operator cannot mistype, unlike a flag that has to
          # agree with it.
          CMD=(railway run --service worker -- python scripts/check_pro_service_areas.py)
          if [ -n "$FLAGS" ]; then
            CMD+=("$FLAGS")
          fi

          "${CMD[@]}" 2>&1 | tee report.txt
          code=${PIPESTATUS[0]}

          # Railway has two credential names and the CLI reads them from
          # different variables: a classic project token from RAILWAY_TOKEN,
          # and a newer workspace-scoped token from RAILWAY_API_TOKEN. Both
          # appear on the same Project Settings → Tokens page and look
          # identical — a UUID with an environment beside it — so there is no
          # way to tell from the dashboard which kind you were handed.
          #
          # On 2026-09-10 that cost most of a day. Production's token, created
          # four months earlier, authenticated fine; a staging token created
          # that morning was refused as "Invalid RAILWAY_TOKEN ... and has
          # access to the resource you're trying to use" — the same sentence
          # Railway uses for a bad value — through three rotations, while the
          # fingerprint step proved the value matched the dashboard exactly
          # and a production run nine minutes earlier proved nothing global
          # was broken. Age of the token was the only variable left.
          #
          # So try the other name rather than asking a human to guess which
          # kind they have. Authentication is judged by whether the refusal
          # is still in the output, not by the exit code: the script exits
          # 1/2/3 for real findings, and those are not credential failures.
          if [ "$code" -ne 0 ] && grep -qiE 'invalid railway_token|unauthorized|not signed in' report.txt; then
            echo "::warning::Railway refused this credential under RAILWAY_TOKEN. Retrying the identical value under RAILWAY_API_TOKEN, which is where the CLI looks for a workspace-scoped token."
            API_TOKEN="$RAILWAY_TOKEN"
            RAILWAY_TOKEN="" RAILWAY_API_TOKEN="$API_TOKEN" "${CMD[@]}" 2>&1 | tee report.txt
            code=${PIPESTATUS[0]}
            if grep -qiE 'invalid railway_token|unauthorized|not signed in' report.txt; then
              AUTH_FAILED=1
              echo "::error::Railway refused the credential under both names. The value is not the problem if the fingerprint above matches the dashboard — check that the token still exists in Railway → Project Settings → Tokens and that its environment column reads the target."
            else
              echo "::notice::Authenticated under RAILWAY_API_TOKEN, not RAILWAY_TOKEN — this secret holds a workspace-scoped token. 🛑 Stop Railway Proli Services reads the same secret under the old name only, and needs the same treatment before it is next relied on."
            fi
          fi

          {
            echo "## 🗺️ Pro service areas — $RAILWAY_ENV"
            echo
            echo "- Mode: $MODE"
            echo "- Exit code: \`$code\`"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The script's exit codes, kept as the job's verdict so a checklist
          # can be ticked on a green run and only on a green run. Skipped
          # when the credential was refused: the CLI's exit 1 is not the
          # script's exit 1, and reading it as one would report "some pros
          # have areas the geocoder does not know" about pros that were
          # never looked at.
          if [ "${AUTH_FAILED:-0}" = "1" ]; then
            exit 1
          fi

          case "$code" in
            0)
              echo "✅ Every checked pro can be placed on the map."
              ;;
            1)
              echo "::error::Some pros have service areas the geocoder does not know, or resolve but carry no location. See the job summary — fix the areas in the admin panel, or re-run with the apply box ticked."
              ;;
            2)
              echo "::warning::The geocoder was unavailable for at least one area, so the verdict is incomplete. Re-run in a minute (the geo:unavailable flag clears after 60s)."
              ;;
            3)
              echo "::error::No pro matched the filter, so this run checked nothing and is not evidence of anything. The report says which population is empty — see the job summary."
              ;;
            *)
              echo "::error::The check did not complete (exit $code). See the log above."
              ;;
          esac
          exit "$code"
