name: 🛑 Stop Railway Proli Services

# The branch you run this from IS the target: `dev` stops staging, `production`
# stops production, anything else refuses. See docs/CI_WORKFLOWS.md.

run-name: >-
  ${{ github.ref_name == 'production' && '🛑 Stop PRODUCTION (api, worker, admin)' || (github.ref_name == 'dev' && '🛑 Stop staging (api, worker, admin)' || '🛑 Refused — run from dev (staging) or production') }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stop-railway-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  stop-railway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The branch name reaches the script through `env:`, never `${{ }}`
      # inside `run:`, and only the two known names resolve to a target.
      - name: Resolve the target from the branch
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${REF_NAME:-}" in
            dev)        TARGET=staging ;;
            production) TARGET=production ;;
            *)
              echo "::error::Run this workflow from 'dev' to stop staging or from 'production' to stop production. Branch '${REF_NAME:-}' maps to nothing. Refusing to stop anything."
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Branch '$REF_NAME' → stopping $TARGET."

      # Pinned, not `latest`, so the failure mode cannot change without a commit.
      # Bump it on purpose. 5.63.3 is the version the last readable run used.
      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli@5.63.3
          railway --version

      # Keyed on the resolve step's output, not the branch again, so the token and
      # environment name cannot disagree with what was resolved.
      - name: Stop Services in ${{ steps.target.outputs.target }}
        id: stop
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.target == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
          # Explicit, so a mis-scoped token cannot take down the other environment.
          RAILWAY_ENV: ${{ steps.target.outputs.target == 'production' && 'Production' || 'Staging' }}
        run: |
          set -uo pipefail
          echo "Stopping services in $RAILWAY_ENV..."

          # "Already stopped" is the only failure that means success. Anything
          # else, a rejected token above all, must turn the job red.
          failed=""
          for svc in api worker admin; do
            rc=0
            out=$(railway down --service "$svc" --environment "$RAILWAY_ENV" -y 2>&1) || rc=$?
            echo "$out"
            if [ "$rc" -eq 0 ]; then
              echo "$svc: stopped"
            elif printf '%s' "$out" | grep -qi "no deployments found"; then
              echo "$svc: no active deployment (already stopped)"
            else
              echo "::error::$svc was NOT stopped (railway exit $rc) — see the output above."
              failed="$failed $svc"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::NOT stopped in $RAILWAY_ENV:$failed. Stop them from the Railway dashboard. What the CLI printed is above; docs/RAILWAY_SETUP.md ('The credentials CI holds') records what has been ruled out."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### ❌ NOT stopped in $RAILWAY_ENV:$failed"
                echo ""
                echo "The services above are **still running**. Stop them from the Railway dashboard."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          echo "All services stopped (redis left running)."
