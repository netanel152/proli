name: 🛑 Stop Railway Proli Services

# `railway down` removes a service's active deployment — the environment stops
# serving. There is nothing to choose and nothing to type: the branch you run
# the workflow from IS the target. `dev` stops staging (dev auto-deploys to
# staging), `production` stops production. Any other branch refuses, so a
# feature branch can never take an environment down. The run-list line names
# the target before anything happens.
#
# The confirm box this replaced (2026-09-08) refused four runs in a row — a
# phone keyboard's trailing space, then the wrong word typed into it — so the
# operator saw a workflow that did not work at exactly the moment it was
# needed. The "which environment" decision is now made by which branch the
# operator picks in the Run-workflow dropdown, a choice that cannot be
# misspelled.

run-name: >-
  ${{ github.ref_name == 'production' && '🛑 Stop PRODUCTION (api, worker, admin)' || (github.ref_name == 'dev' && '🛑 Stop staging (api, worker, admin)' || '🛑 Refused — run from dev (staging) or production') }}

on:
  workflow_dispatch:

jobs:
  stop-railway:
    runs-on: ubuntu-latest
    steps:
      # The branch name reaches the script through `env:`, never `${{ }}`
      # inside `run:`, and only the two known names resolve to a target.
      - name: Resolve the target from the branch
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${REF_NAME:-}" in
            dev)        TARGET=staging ;;
            production) TARGET=production ;;
            *)
              echo "::error::Run this workflow from 'dev' to stop staging or from 'production' to stop production. Branch '${REF_NAME:-}' maps to nothing. Refusing to stop anything."
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Branch '$REF_NAME' → stopping $TARGET."

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Keyed on the resolve step's output, not on the branch name again, so
      # the token and the environment name can never disagree with what was
      # just resolved.
      - name: Stop Services in ${{ steps.target.outputs.target }}
        id: stop
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.target == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
          # Explicit rather than relying on the token's default environment, so a
          # mis-scoped token cannot take down the environment you did not pick.
          RAILWAY_ENV: ${{ steps.target.outputs.target == 'production' && 'Production' || 'Staging' }}
        run: |
          set -uo pipefail
          echo "Stopping services in $RAILWAY_ENV..."

          # "Already stopped" is the only failure that means success — it is what
          # makes a second run idempotent. Anything else (a rejected token above
          # all) used to be swallowed by a blanket `|| echo "no active
          # deployment"`, after which the job printed "All services stopped" and
          # went green having stopped nothing. This is the workflow an operator
          # reaches for when something must stop NOW, so a green check that is not
          # evidence is the worst thing it can emit (PRO-128 / PRO-183's shape).
          failed=""
          for svc in api worker admin; do
            rc=0
            out=$(railway down --service "$svc" --environment "$RAILWAY_ENV" -y 2>&1) || rc=$?
            echo "$out"
            if [ "$rc" -eq 0 ]; then
              echo "$svc: stopped"
            elif printf '%s' "$out" | grep -qi "no deployments found"; then
              echo "$svc: no active deployment (already stopped)"
            else
              echo "::error::$svc was NOT stopped (railway exit $rc) — see the output above."
              failed="$failed $svc"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::NOT stopped in $RAILWAY_ENV:$failed. Stop them from the Railway dashboard (docs/RAILWAY_SETUP.md, 'The credentials CI holds' — the staging token is known broken)."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### ❌ NOT stopped in $RAILWAY_ENV:$failed"
                echo ""
                echo "The services above are **still running**. Stop them from the Railway dashboard."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          echo "All services stopped (redis left running)."
