name: tests

on:
  pull_request:
    # Adding the floor label must start a run: a re-run replays the original
    # event, so it would not see the label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    # `production` too: a red run there means something skipped `dev`.
    branches: [dev, production]

permissions:
  contents: read

# Superseded PR runs are cancelled. A push keeps a group of its own per SHA, not
# per branch: GitHub drops a waiting run from a busy group even with cancelling
# off, and promote needs the `pytest` result on every dev SHA.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the required check in branch protection, and promote reads it.
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: "ci-not-a-real-key"
      CLOUDINARY_CLOUD_NAME: "ci"
      CLOUDINARY_API_KEY: "ci"
      CLOUDINARY_API_SECRET: "ci"
      # Not what keeps the suite from sending: tests/conftest.py forces this back
      # to False, and those tests stub `_send_request`.
      WHATSAPP_DRY_RUN: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `*.md` is excluded on purpose: prose naming the retired vendor is not a
      # bypass. `.github` is excluded because the pattern below names its host.
      - name: Guard — no legacy WhatsApp vendor references
        id: vendor-guard
        run: |
          if grep -rInE 'greenapi\.com|green-api\.com' \
               --exclude-dir=.git \
               --exclude-dir=.github \
               --exclude-dir=venv \
               --exclude-dir=__pycache__ \
               --exclude-dir=logs \
               --exclude='*.md' \
               . ; then
            echo ""
            echo "::error::Legacy WhatsApp vendor reference found in code. Proli left that vendor"
            echo "::error::in PRO-85; all WhatsApp traffic goes through app/providers/whatsapp/."
            echo "::error::Prose may name it (*.md is not scanned) — code, scripts and fixtures may not."
            exit 1
          fi
          echo "OK — no legacy WhatsApp vendor references in code."

      # ARCHITECTURE_STANDARD.md §6.2. geocoding_service is the one allowlisted
      # HTTP consumer (Nominatim, not a messaging vendor); tests may build providers.
      - name: Guard — all outbound traffic through the provider facade
        run: |
          if grep -rInE '^\s*(import|from)\s+(httpx|requests)\b' app/services/ \
               | grep -v 'app/services/geocoding_service.py' ; then
            echo ""
            echo "::error::HTTP client import in a service. Outbound WhatsApp goes"
            echo "::error::through app/providers/whatsapp/ (PRO-86); other HTTP"
            echo "::error::belongs in app/core/http_client.py or a provider. If this"
            echo "::error::service is a legitimate non-vendor HTTP consumer, add it"
            echo "::error::to the allowlist in this step with a reason."
            exit 1
          fi
          if grep -rInE '(CloudAPIProvider|DryRunProvider)\s*\(' app/ \
               --exclude-dir=__pycache__ \
               | grep -v 'app/providers/whatsapp/' ; then
            echo ""
            echo "::error::Provider constructed outside app/providers/whatsapp/."
            echo "::error::Use app.providers.whatsapp.get_whatsapp() — a bare provider"
            echo "::error::skips the circuit breaker and the operator kill switch."
            exit 1
          fi
          echo "OK — single egress holds."

      - name: Lint — actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Before the suite, so a dev merge landing mid-run cannot raise this PR's floor.
      - name: Restore dev's passed count
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pytest-floor
          key: pytest-passed-${{ github.sha }}
          restore-keys: pytest-passed-

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Matches the Dockerfile's base image, so CI resolves the same wheels as production.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint — black --check
        run: black --check --diff .

      - name: Lint — flake8
        run: flake8 --count .

      - name: Run tests
        run: |
          set -o pipefail
          pytest -q | tee pytest-output.txt

      - name: Read the passed count from pytest's summary
        id: count
        run: |
          passed=$(grep -oP '\b\K[0-9]+(?= passed)' pytest-output.txt | tail -1)
          if [ -z "$passed" ]; then
            echo "::error::Could not parse the passed count from pytest's summary."
            exit 1
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "$passed passed."

      # The floor is dev's newest count, kept in the Actions cache rather than a
      # file every PR would have to edit. See docs/CI_WORKFLOWS.md.
      - name: Guard — test floor (dev's passed count)
        id: floor
        if: github.event_name == 'pull_request'
        env:
          PASSED: ${{ steps.count.outputs.passed }}
          ALLOW_TEST_DROP: ${{ contains(github.event.pull_request.labels.*.name, 'allow-test-drop') }}
        run: |
          set -euo pipefail
          if ! floor=$(grep -xE '[0-9]+' pytest-floor/passed 2>/dev/null); then
            echo "::warning::No test floor was checked: dev has no recorded count (first run, or the cache was evicted). The next push to dev records one."
            exit 0
          fi
          if [ "$PASSED" -ge "$floor" ]; then
            echo "OK — $PASSED passed, dev's floor is $floor."
            exit 0
          fi
          if [ "$ALLOW_TEST_DROP" = "true" ]; then
            echo "::warning::$PASSED tests passed, below dev's floor of $floor. Allowed by the allow-test-drop label."
            exit 0
          fi
          echo "::error::Regression: $PASSED tests passed, below dev's floor of $floor. If this PR is behind dev, merge dev and push: a re-run tests the same stale merge commit. If tests were removed on purpose, add the allow-test-drop label."
          exit 1

      - name: Record the passed count for dev's floor
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          PASSED: ${{ steps.count.outputs.passed }}
        run: |
          mkdir -p pytest-floor
          printf '%s\n' "$PASSED" > pytest-floor/passed

      - name: Save dev's passed count
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pytest-floor
          key: pytest-passed-${{ github.sha }}
